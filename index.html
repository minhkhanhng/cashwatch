<title>CashWatch</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone-width column, a sticky header, a fixed tab bar; the home screen leads with one number. */
:root {
  --bg: #F2F3F7;
  --surface: #FFFFFF;
  --surface-2: #E8EAF1;
  --ink: #171925;
  --muted: #5F6579;
  --line: #D9DCE6;
  --accent: #3B37B3;
  --accent-ink: #FFFFFF;
  --accent-soft: #E5E4F9;
  --pos: #137A52;
  --pos-soft: #DCF1E7;
  --neg: #BE3626;
  --neg-soft: #F8E2DE;
  --warn: #9A600C;
  --warn-soft: #F5EAD4;
  --debt: #D9692A;
  --t-blue: #2F6FD6; --t-blue-bg: #E3EDFC;
  --t-orange: #C2620F; --t-orange-bg: #FCEBDA;
  --t-teal: #0E8478; --t-teal-bg: #D9F2EE;
  --t-pink: #C23B6C; --t-pink-bg: #FBE3EC;
  --t-purple: #7445C9; --t-purple-bg: #EEE6FB;
  --shadow: 0 1px 2px rgba(23, 25, 37, .06), 0 8px 24px rgba(23, 25, 37, .06);
  --font-display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F15; --surface: #181A23; --surface-2: #222532; --ink: #ECEEF6; --muted: #9AA0B6; --line: #2B2F3F;
    --accent: #A29FFF; --accent-ink: #15143A; --accent-soft: #26244F;
    --pos: #4FCB94; --pos-soft: #143327; --neg: #FF8170; --neg-soft: #3A1A16; --warn: #E8B45A; --warn-soft: #362812;
    --debt: #F29A5E;
    --t-blue: #7DAEFF; --t-blue-bg: #1C2A45; --t-orange: #F5A65B; --t-orange-bg: #3A2614; --t-teal: #4FD1C0; --t-teal-bg: #12322E; --t-pink: #FF8AB3; --t-pink-bg: #3A1726; --t-purple: #B79AFF; --t-purple-bg: #2A2147;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F15; --surface: #181A23; --surface-2: #222532; --ink: #ECEEF6; --muted: #9AA0B6; --line: #2B2F3F;
  --accent: #A29FFF; --accent-ink: #15143A; --accent-soft: #26244F;
  --pos: #4FCB94; --pos-soft: #143327; --neg: #FF8170; --neg-soft: #3A1A16; --warn: #E8B45A; --warn-soft: #362812;
  --debt: #F29A5E;
  --t-blue: #7DAEFF; --t-blue-bg: #1C2A45; --t-orange: #F5A65B; --t-orange-bg: #3A2614; --t-teal: #4FD1C0; --t-teal-bg: #12322E; --t-pink: #FF8AB3; --t-pink-bg: #3A1726; --t-purple: #B79AFF; --t-purple-bg: #2A2147;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 8px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Type */
h2 { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin: 0; letter-spacing: -.005em; text-wrap: balance; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px; }

/* Hero */
.hero { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 14px; }
.hero-num { font-family: var(--font-display); font-weight: 700; font-size: clamp(38px, 11vw, 52px); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero-num .cur { font-size: .45em; font-weight: 500; letter-spacing: 0; margin-left: 4px; color: var(--muted); }
.hero-num.neg { color: var(--neg); }
.hero-sub { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--muted); font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.pos { background: var(--pos-soft); color: var(--pos); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neg { background: var(--neg-soft); color: var(--neg); }
.pill.soft { background: var(--surface-2); color: var(--muted); }
.pace { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: visible; }
.pace-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }
.pace-fill.warn { background: var(--warn); }
.pace-fill.neg { background: var(--neg); }
.pace-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 2px; }
.pace-legend { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
.ledger { display: grid; grid-template-columns: 1fr auto; gap: 6px 0; font-size: 14px; border-top: 1px dashed var(--line); padding-top: 12px; }
.ledger .v { text-align: right; font-variant-numeric: tabular-nums; padding-left: 12px; }
.ledger .total { font-weight: 600; border-top: 1px solid var(--line); padding-top: 6px; }

/* Cards & lists */
.card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; }
.row:first-child { border-top: 0; }
button.row:hover { background: var(--surface-2); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; }
.row-amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.row-amt.in { color: var(--pos); }
.badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
.avatar { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; background: var(--surface-2); color: var(--muted); flex: none; }
.avatar.in { background: var(--pos-soft); color: var(--pos); }
.avatar.save { background: var(--accent-soft); color: var(--accent); }
.avatar svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.avatar.sm { width: 28px; height: 28px; border-radius: 9px; }
.avatar.sm svg { width: 16px; height: 16px; }
.avatar.t-blue { background: var(--t-blue-bg); color: var(--t-blue); }
.avatar.t-orange { background: var(--t-orange-bg); color: var(--t-orange); }
.avatar.t-teal { background: var(--t-teal-bg); color: var(--t-teal); }
.avatar.t-pink { background: var(--t-pink-bg); color: var(--t-pink); }
.avatar.t-purple { background: var(--t-purple-bg); color: var(--t-purple); }
.avatar.t-green { background: var(--pos-soft); color: var(--pos); }
.avatar.t-accent { background: var(--accent-soft); color: var(--accent); }
.avatar.t-gray { background: var(--surface-2); color: var(--muted); }
.cat-title { display: inline-flex; align-items: center; gap: 10px; }
.empty { padding: 18px 14px; color: var(--muted); font-size: 14px; }

/* Pending recurring */
.pending { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-top: 1px solid var(--line); }
.pending:first-child { border-top: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.danger { color: var(--neg); border-color: var(--neg); background: none; }
.btn.danger.armed { background: var(--neg); color: var(--surface); }
.btn.block { width: 100%; padding: 13px 16px; font-size: 15px; border-radius: 12px; }
.btn:disabled { opacity: .5; cursor: default; }

.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.amt-out { border-color: transparent; background: var(--neg-soft); color: var(--neg); font-weight: 600; }
.chip.amt-in { border-color: transparent; background: var(--pos-soft); color: var(--pos); font-weight: 600; }
.chip.hint { border-style: dashed; color: var(--muted); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--muted); }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); }

/* Month view */
.switcher { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.page-head { display: flex; align-items: center; gap: 12px; }
.page-head h2 { margin: 0; font-size: 20px; }
.switcher h2 { font-size: 20px; }
.cat-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 11px 14px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; }
.cat-row:first-child { border-top: 0; }
.cat-row:hover { background: var(--surface-2); }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--surface-2); position: relative; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; }
.bar > i.over { background: var(--neg); }
.summary { padding: 14px; }

/* Close view */
.month-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.month-chips .chip { padding: 6px 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 11px 12px; font-size: 16px; width: 100%; min-width: 0; }
.field .help { font-size: 12.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }
.diff { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.diff.pos { background: var(--pos-soft); }
.diff.neg { background: var(--neg-soft); }
.diff.ok { background: var(--surface-2); }
.diff strong { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Overview */
.worth .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; justify-content: space-between; text-align: left; min-width: 0; }
.tile-label { font-size: 12.5px; color: var(--muted); line-height: 1.25; }
.tile-v { font-family: var(--font-display); font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.neg-t { color: var(--neg); }
.month-card { display: flex; flex-direction: column; gap: 12px; }
.safe-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 14px; }
.safe-line > div { display: flex; flex-direction: column; }
.safe-line b { font-family: var(--font-display); font-size: 26px; letter-spacing: -.02em; }
.safe-line .muted { font-size: 13px; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.trio > div { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; color: var(--muted); }
.trio > div + div { border-left: 1px solid var(--line); }
.trio b { font-size: 15px; color: var(--ink); font-weight: 600; }
.goal-mini { width: 100%; text-align: left; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.goal-mini-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.goal-mini-top > span:first-child { display: flex; flex-direction: column; gap: 2px; }
.goal-big { font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: -.02em; line-height: 1.1; }
.goal-next { display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; gap: 2px; }
.day { display: flex; flex-direction: column; gap: 8px; }
.day-head { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.day-num { font-family: var(--font-display); font-weight: 700; font-size: 26px; width: 36px; }
.day-label { display: flex; flex-direction: column; flex: 1; font-size: 13px; line-height: 1.3; }
.day-net { font-weight: 600; }
.day-net.in { color: var(--pos); }
.seg.seg3 { grid-template-columns: repeat(3, 1fr); }
.cat-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cat-scroll .chip { padding: 6px 12px; }
.qa-big { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; font-size: 20px; width: 100%; }
.tab.fab { padding-top: 0; }
.fab-btn { width: 52px; height: 52px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: -14px; box-shadow: var(--shadow); }
.fab-btn svg { width: 26px; height: 26px; stroke-width: 2.2; }

/* Quick add */
.qa { display: flex; flex-direction: column; gap: 12px; }
.qa-amount { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 2px; text-align: center; }
.qa-amount .num { font-family: var(--font-display); font-weight: 700; font-size: 38px; letter-spacing: -.02em; line-height: 1.1; color: var(--neg); }
.qa-amount.in .num { color: var(--pos); }
.qa-amount.empty .num { color: var(--line); }
.qa-amount small { font-size: .5em; margin-left: 4px; font-weight: 500; color: var(--muted); }
.qa-sub { font-size: 13.5px; color: var(--muted); min-height: 20px; }
.qa-dates { display: flex; gap: 6px; flex-wrap: wrap; }
.qa-dates .chip { padding: 7px 12px; }
.date-chip { position: relative; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.date-chip svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.date-chip input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.chip.recent b { font-weight: 600; margin-left: 4px; }
#qa-recent { display: flex; flex-direction: column; gap: 6px; }
.cat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cat-btn { border: 1px solid transparent; background: none; border-radius: 12px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; line-height: 1.2; color: var(--ink); min-width: 0; }
.cat-btn span:last-child { overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
.cat-btn:hover { background: var(--surface-2); }
.cat-btn.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.cat-btn .avatar { width: 40px; height: 40px; border-radius: 12px; }
.qa-actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); background: var(--bg); display: flex; gap: 10px; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); margin-bottom: -10px; z-index: 2; }
.qa-actions .btn { flex: 1; padding: 13px; font-size: 15px; border-radius: 12px; }
.qa-actions .btn.primary { flex: 2; }
details.info { font-size: 13px; color: var(--muted); }
details.info summary { cursor: pointer; color: var(--accent); font-weight: 600; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
details.info summary::-webkit-details-marker { display: none; }
details.info summary::before { content: "?"; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; }
details.info p { margin: 6px 0 0; line-height: 1.6; }

/* Hỗ trợ đọc hiểu */
.eyebrow-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.eyebrow-row details.info { text-align: right; }
.eyebrow-row details.info[open] { flex-basis: 100%; text-align: left; }
.money-hint { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 0; }
.money-hint:empty { display: none; }
.money-hint.bad { color: var(--neg); }
.setup-fixed .row { cursor: text; }
.setup-fixed input { width: 120px; flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 10px; font-size: 16px; text-align: right; }
.setup-fixed .money-hint { display: none; }
.checklist .row[disabled] { cursor: default; }
.check-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }
.check-dot.on { background: var(--pos); border-color: var(--pos); color: var(--surface); }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px 11px 38px; font-size: 16px; }
.trio.flat { border-top: 0; border-bottom: 1px dashed var(--line); margin: 0 -14px 10px; }
.steps li .avatar { flex: none; }

/* Goal */
.chart-wrap { position: relative; padding: 12px 10px 6px; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); padding: 0 4px 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw-bar { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.sw-line { width: 14px; height: 2px; border-radius: 2px; background: var(--debt); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; line-height: 1.4; white-space: nowrap; transform: translateX(-50%); box-shadow: var(--shadow); }
.tip b { font-weight: 600; }
.term-amt { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.term-amt small { font-size: 12px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.badge.debt { background: var(--warn-soft); color: var(--warn); }
.badge.pos { background: var(--pos-soft); color: var(--pos); }
.row.now { background: var(--accent-soft); }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.list-edit { display: flex; flex-direction: column; gap: 8px; }
.list-edit .line { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 40px; gap: 8px; align-items: end; }
.list-edit .line .icon-btn { width: 40px; height: 44px; }
fieldset { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
legend { font-weight: 600; font-size: 14px; padding: 0 6px; }

/* Sheet */
.backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(10, 11, 18, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; border-radius: 22px 22px 0 0; padding-top: 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(24px); } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip { padding: 6px 12px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1; }
.list-plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* Onboarding */
.welcome { display: flex; flex-direction: column; gap: 16px; padding-block: 12px 0; }
.welcome h1 { font-family: var(--font-display); font-size: 34px; line-height: 1.05; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.steps { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.steps li { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.steps b { display: block; font-size: 15px; }
.example { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: var(--surface-2); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }

/* Toast */
/* Thông báo nằm ngay trên thanh tab, gần ngón cái. Trong sheet ghi nhanh, chỗ này nằm ngay trên nút Ghi nên không che nút Xong */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 10px 10px 16px; display: flex; gap: 12px; align-items: center; font-size: 14px; box-shadow: var(--shadow); width: max-content; max-width: min(480px, calc(100% - 32px)); animation: toast-in .18s ease-out; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
.toast span { flex: 1; min-width: 0; }
.toast button { background: none; border: 0; color: var(--accent-soft); font-weight: 700; padding: 6px 8px; white-space: nowrap; flex: none; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .sheet, .shake { animation: none; }
}

const UNITS = { k: 1e3, "nghìn": 1e3, nghin: 1e3, "ngàn": 1e3, ngan: 1e3, tr: 1e6, "triệu": 1e6, trieu: 1e6, "củ": 1e6, cu: 1e6, m: 1e6, "tỷ": 1e9, ty: 1e9, "đ": 1, d: 1, vnd: 1 };
const UNIT_SRC = "k|nghìn|nghin|ngàn|ngan|triệu|trieu|tr|củ|cu|m|tỷ|ty|vnd|đ|d";

const fmtRate = r => Number((r || 0).toFixed(2)).toString().replace(".", ",");
const parsePct = s => { const v = parseFloat(String(s ?? "").replace("%", "").replace(",", ".").trim()); return isNaN(v) ? null : v; };
function goalChart(terms, hasLoans) {
  const W = 340, H = 196, L = 44, R = 14, TOP = 18, B = 24, n = terms.length;
  const maxV = Math.max(1, ...terms.map(t => Math.max(t.after, t.debt || 0)));
  const step = [5e7, 1e8, 2e8, 2.5e8, 5e8, 1e9, 2e9, 5e9, 1e10].find(s => Math.ceil(maxV / s) <= 4) || 1e10;
  const top = Math.ceil(maxV / step) * step;
  const y = v => TOP + (H - TOP - B) * (1 - v / top), base = y(0);
  const band = (W - L - R) / n, bw = Math.min(20, band * 0.62);
  const cx = i => L + band * (i + 0.5);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Số dư sổ tiết kiệm${hasLoans ? " và nợ còn lại" : ""} theo từng kỳ">`;
  for (let v = 0; v <= top + 1; v += step) {
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10.5" fill="var(--muted)">${v ? short(v) : "0"}</text>`;
  }
  s += `<line id="goal-cross" x1="0" x2="0" y1="${TOP - 6}" y2="${base}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  let prevYear = null;
  terms.forEach((t, i) => {
    const x0 = cx(i) - bw / 2, x1 = cx(i) + bw / 2, yt = y(Math.max(0, t.after)), h = base - yt, r = Math.min(4, bw / 2, h);
    if (h > 0.5) s += `<path d="M${x0} ${base}V${yt + r}Q${x0} ${yt} ${x0 + r} ${yt}H${x1 - r}Q${x1} ${yt} ${x1} ${yt + r}V${base}Z" fill="var(--accent)"/>`;
    const yr = t.m.slice(0, 4);
    if (yr !== prevYear) { s += `<text x="${cx(i)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${yr}</text>`; prevYear = yr; }
  });
  if (hasLoans) {
    let d = "", started = false, done = false, firstI = -1;
    terms.forEach((t, i) => {
      if (!started) { if (t.debt > 0) { started = true; firstI = i; d = `M${cx(i)} ${y(t.debt)}`; } return; }
      if (done) return;
      d += `H${cx(i)}V${y(Math.max(0, t.debt))}`;
      if (t.debt <= 0) done = true;
    });
    if (d) {
      s += `<path d="${d}" fill="none" stroke="var(--surface)" stroke-width="5" stroke-linejoin="round"/>`;
      s += `<path d="${d}" fill="none" stroke="var(--debt)" stroke-width="2" stroke-linejoin="round"/>`;
      const f = terms[firstI];
      s += `<circle cx="${cx(firstI)}" cy="${y(f.debt)}" r="4" fill="var(--debt)" stroke="var(--surface)" stroke-width="2"/>`;
      s += `<text x="${cx(firstI) + 8}" y="${y(f.debt) - 7}" font-size="11" font-weight="600" fill="var(--ink)">Nợ ${short(f.debt)}</text>`;
    }
  }
  const li = n - 1, lt = terms[li];
  s += `<text x="${Math.min(cx(li), W - R - 2)}" y="${y(Math.max(0, lt.after)) - 6}" text-anchor="end" font-size="11" font-weight="600" fill="var(--ink)">${short(lt.after)}</text>`;
  terms.forEach((t, i) => { s += `<rect data-i="${i}" x="${L + band * i}" y="${TOP - 6}" width="${band}" height="${base - TOP + 6}" fill="transparent"/>`; });
  return s + "</svg>";
}
function attachGoalHover(terms) {
  const wrap = $("#goal-chart"); if (!wrap) return;
  const svg = wrap.querySelector("svg"), tip = $("#goal-tip"), cross = $("#goal-cross");
  const hide = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); };
  const show = e => {
    const r = e.target.closest && e.target.closest("rect[data-i]");
    if (!r) return hide();
    const t = terms[Number(r.dataset.i)];
    const box = svg.getBoundingClientRect(), wb = wrap.getBoundingClientRect();
    const cxv = Number(r.getAttribute("x")) + Number(r.getAttribute("width")) / 2;
    const px = box.left - wb.left + cxv / 340 * box.width;
    cross.setAttribute("x1", cxv); cross.setAttribute("x2", cxv); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<b>${t.open ? "Mở sổ" : "Kỳ"} ${mShort(t.m)}</b><br>Sổ ${money(t.after)}${t.open ? "" : ` · lãi ${fmtRate(t.savRate)}%`}${t.pay ? `<br>Trả nợ ${short(t.pay)}${t.payInt >= 1 ? ` (lãi ${short(t.payInt)})` : ""}` : ""}${t.debt > 0 || t.pay ? `<br>Nợ còn ${short(t.debt)}` : ""}`;
    tip.hidden = false;
    tip.style.left = Math.max(80, Math.min(wb.width - 80, px)) + "px";
    tip.style.top = (box.top - wb.top + box.height * 0.42) + "px";
  };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", hide);
}

function saveSetup(st) {
  const cur = curMonth();
  const rec = [], done = [];
  const inc = parseMoney($("#su-income").value);
  if (inc && inc > 0) { const r = { id: uid(), name: "Lương", amt: inc, kind: "in", cat: "Paycheck", active: true, since: cur }; rec.push(r); if (st.incDone) done.push(r); }
  for (const f of SETUP_FIXED) {
    const v = parseMoney($("#su-" + f.key).value);
    if (!v || v <= 0) continue;
    const r = { id: uid(), name: f.name, amt: v, kind: "out", cat: f.cat, active: true, since: cur };
    rec.push(r); if (st.fixDone) done.push(r);
  }
  // Khoản đã nhận/đã trả trong tháng được ghi thành giao dịch thật, để Thu, Chi, Để dành hiện đúng ngay.
  // Tiền đang có đã gồm các khoản này, nên số dư đầu tháng được tính ngược lại từ đó.
  const cash = parseMoney($("#su-cash").value) || 0;
  const net = done.reduce((a, r) => a + (r.kind === "in" ? r.amt : -r.amt), 0);
  S = Object.assign(DEFAULTS(), { startMonth: cur, openingBalance: cash - net, startMid: true, recurring: rec, skips: {} });
  M = {}; hasData = true; ui.tab = "home";
  for (const r of done) addTx({ m: cur, d: cur + "-01", kind: r.kind, amt: r.amt, unit: r.amt, qty: 1, desc: r.name, cat: r.cat, n: 1, rid: r.id });
  Store.touch("settings"); closeSheet(); render(); window.scrollTo(0, 0);
  toast("Xong! Bấm nút + để ghi khoản chi đầu tiên");
}

/* ---------- Ghi nhanh: nút + giữa thanh dưới. Gõ một dòng hoặc chạm khoản gần đây, chọn danh mục bằng biểu tượng, chọn ngày bằng một chạm ---------- */
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return isoDay(d); };
function dayLabel(iso) {
  if (iso === today()) return "Hôm nay";
  if (iso === yesterday()) return "Hôm qua";
  const [y, m, d] = iso.split("-").map(Number);
  return `${WEEKDAY[new Date(y, m - 1, d).getDay()]}, ${d}/${m}`;
}
function openQuickAdd() {
  ui.qaCat = null; ui.qaKind = null; ui.qaAdded = [];
  const vm = ui.tab === "month" ? ui.viewMonth : curMonth();
  ui.qaDate = vm === curMonth() ? today() : `${vm}-${pad(daysIn(vm))}`;
  openSheet(`<div class="sheet-head"><h2>Ghi giao dịch</h2><button class="btn ghost" data-act="sheet-close">Xong</button></div>
    <form id="qa-form" class="qa" autocomplete="off">
      <div id="qa-kind"></div>
      <div class="qa-amount" id="qa-amount" aria-live="polite"></div>
      <input id="qa-input" class="qa-big" enterkeyhint="done" placeholder="vd 55k phở" aria-label="Số tiền và nội dung">
      <div class="qa-dates" id="qa-dates"></div>

      <div class="cat-grid" id="qa-cats" role="radiogroup" aria-label="Danh mục"></div>

      <div id="qa-added"></div>
    </form>`, { qa: true });
  $("#qa-input").focus();
  renderQaPreview();
}
function qaState() {
  const p = parseQuick($("#qa-input").value);
  const kind = ui.qaKind || p.kind;
  const cat = ui.qaCat || (kind === p.kind ? p.cat : guessCat(p.desc, kind));
  return { p, kind, cat };
}
// Các khoản đã ghi gần đây (khác nhau), để chạm một lần là điền lại
function recentEntries(kind) {
  const seen = new Set(), out = [];
  for (const t of allTx().slice().sort((a, b) => (b.at || 0) - (a.at || 0))) {
    if (t.kind !== kind || !t.desc || t.rid) continue; // khoản cố định đã tự hiện mỗi tháng, không cần gợi ý lại
    const k = norm(t.desc) + "|" + t.amt;
    if (seen.has(k)) continue;
    seen.add(k); out.push(t);
    if (out.length >= 6) break;
  }
  return out;
}
function renderQaPreview() {
  const box = $("#qa-amount"); if (!box) return;
  const { p, kind, cat } = qaState();
  const typed = $("#qa-input").value.trim();
  $("#qa-kind").innerHTML = `<div class="seg" role="tablist"><button type="button" class="${kind === "out" ? "on" : ""}" data-act="qa-kind-set" data-kind="out">Khoản chi</button><button type="button" class="${kind === "in" ? "on" : ""}" data-act="qa-kind-set" data-kind="in">Khoản thu</button></div>`;
  box.className = `qa-amount ${kind === "in" ? "in" : ""} ${p.amount == null ? "empty" : ""}`;
  box.innerHTML = `<span class="num">${p.amount != null ? (kind === "in" ? "+" : "−") + nf.format(p.amount) : "0"}<small>₫</small></span>
    <span class="qa-sub">${typed ? (p.amount == null ? "Thêm số tiền, vd 55k" : `${esc(p.desc || catOf(kind, cat).label)}${p.qty > 1 ? ` · ${short(p.unit)} × ${p.qty}` : ""} · ${esc(catOf(kind, cat).label)}`) : "Chọn danh mục bên dưới, hoặc chạm một khoản gần đây"}</span>`;
  const dates = [today(), yesterday()];
  const custom = !dates.includes(ui.qaDate);
  $("#qa-dates").innerHTML = `${dates.map(d => `<button type="button" class="chip ${ui.qaDate === d ? "on" : ""}" data-act="qa-date" data-d="${d}">${dayLabel(d)}</button>`).join("")}
    <label class="chip date-chip ${custom ? "on" : ""}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>${custom ? dayLabel(ui.qaDate) : "Ngày khác"}<input type="date" id="qa-date-pick" value="${ui.qaDate}" max="${today()}" aria-label="Chọn ngày"></label>`;
  const rec = typed ? [] : recentEntries(kind);
  $("#qa-recent").innerHTML = rec.length ? `<div class="eyebrow">Ghi lại khoản gần đây</div><div class="cat-scroll">${rec.map(t => `<button type="button" class="chip recent" data-act="qa-recent" data-id="${t.id}">${esc(t.desc)} <b class="num">${short(t.amt)}</b></button>`).join("")}</div>` : "";
  const pick = typed || ui.qaCat ? cat : null;
  $("#qa-cats").innerHTML = catList(kind).map(c => `<button type="button" class="cat-btn ${c.id === pick ? "on" : ""}" role="radio" aria-checked="${c.id === pick}" data-act="qa-cat-set" data-cat="${esc(c.id)}">${catAvatar(kind, c.id)}<span>${esc(c.label)}</span></button>`).join("");
  const added = (ui.qaAdded || []).map(id => allTx().find(x => x.id === id)).filter(Boolean);
  $("#qa-added").innerHTML = added.length ? `<div class="eyebrow" style="margin-bottom:6px">Vừa ghi</div><div class="card rows">${added.map(txRow).join("")}</div>` : "";
}
function submitQuick(e) {
  e.preventDefault();
  const input = $("#qa-input");

    const f = $("#qa-form"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");

  const d = ui.qaDate || today(), m = d.slice(0, 7);

function upsertStep(list, from, item) {

/* ---------- Excel: một định dạng chung cho xuất, nhập lại và file mẫu ---------- */
let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  xlsxPromise = xlsxPromise || new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => res(window.XLSX);
    s.onerror = () => { xlsxPromise = null; rej(new Error("load")); };
    document.head.appendChild(s);
  });
  return xlsxPromise;
}
const SHEETS = { setup: "Thiết lập", tx: "Giao dịch", rec: "Khoản cố định", budget: "Ngân sách", close: "Chốt sổ" };
const TX_HEAD = ["Tháng", "Ngày", "Loại", "Số tiền", "Đơn giá", "Số lượng", "Diễn giải", "Danh mục", "Số tháng phân bổ", "Cố định"];
const REC_HEAD = ["Tên", "Loại", "Số tiền/tháng", "Danh mục", "Đang áp dụng", "Từ tháng", "Đến tháng", "Các mốc số tiền"];
const BUD_HEAD = ["Danh mục", "Từ tháng", "Số tiền"];
const CLOSE_HEAD = ["Tháng", "Tiền mặt", "Tài khoản"];
const catLabel = (kind, id) => catOf(kind, id).label;

function toMonth(XLSX, v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") { const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${pad(d.m)}` : null; }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-/.](\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}`;
  m = s.match(/^(?:\d{1,2}[-/.])?(\d{1,2})[-/.](\d{4})$/);
  return m ? `${m[2]}-${pad(m[1])}` : null;
}
function toDate(XLSX, v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") { const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : null; }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
  return m ? `${m[3]}-${pad(m[2])}-${pad(m[1])}` : null;
}
const toNum = v => (typeof v === "number" ? v : parseMoney(v));
const toKind = v => (/^(thu|in|\+)/.test(norm(v) || String(v || "").trim()) ? "in" : "out");
const isMark = v => /^(x|co|1|true|yes|v)$/.test(norm(v));
function toCat(v, kind, desc) {
  const n = norm(v);
  if (n) {
    const c = catList(kind).find(c => norm(c.id) === n || norm(c.label) === n);
    if (c) return c.id;
  }
  return guessCat(desc, kind);
}
// Đọc một sheet thành các dòng {tiêu đề đã chuẩn hóa: giá trị}
function sheetRows(XLSX, wb, name) {
  const key = wb.SheetNames.find(s => norm(s) === norm(name));
  if (!key) return null;
  return XLSX.utils.sheet_to_json(wb.Sheets[key], { defval: "", raw: true }).map(r => {
    const o = {};
    for (const [k, v] of Object.entries(r)) o[norm(k)] = v;
    return o;
  });
}
const col = (row, ...names) => { for (const n of names) { const v = row[norm(n)]; if (v !== undefined && v !== "") return v; } return ""; };

function parseWorkbook(XLSX, wb) {
  const txRows = sheetRows(XLSX, wb, SHEETS.tx);
  if (!txRows) throw new Error(`Không thấy sheet “${SHEETS.tx}”. Hãy tải file mẫu trong app và dán dữ liệu vào đó.`);
  const cur = curMonth();
  const rows = [];
  for (const r of txRows) {
    const d = toDate(XLSX, col(r, "Ngày"));
    const m = toMonth(XLSX, col(r, "Tháng")) || (d ? d.slice(0, 7) : null);
    const unit = toNum(col(r, "Đơn giá")), qty = toNum(col(r, "Số lượng")) || 1, total = toNum(col(r, "Số tiền"));
    const amt = total || (unit ? unit * qty : null);
    if (!m || !amt || amt <= 0) continue;
    const kind = toKind(col(r, "Loại")), desc = String(col(r, "Diễn giải")).trim();
    rows.push({ m, d: d || m + "-01", kind, amt, unit: unit || amt / qty, qty, desc, cat: toCat(col(r, "Danh mục"), kind, desc), n: kind === "in" ? 1 : Math.max(1, Math.round(toNum(col(r, "Số tháng phân bổ")) || 1)), mark: isMark(col(r, "Cố định")) });
  }
  if (!rows.length) throw new Error(`Sheet “${SHEETS.tx}” chưa có dòng nào đủ tháng và số tiền.`);

  // Khoản cố định: lấy từ sheet nếu có, không thì tự nhận ra khoản lặp lại ở từ 3 tháng trở lên
  const recurring = [];
  const recRows = sheetRows(XLSX, wb, SHEETS.rec);
  let recFromSheet = false;
  if (recRows && recRows.length) {
    for (const r of recRows) {
      const name = String(col(r, "Tên")).trim(), amt = toNum(col(r, "Số tiền/tháng", "Số tiền"));
      if (!name || !amt) continue;
      const kind = toKind(col(r, "Loại"));
      const steps = String(col(r, "Các mốc số tiền")).split(";").map(p => p.split(":")).filter(p => p.length === 2)
        .map(([f, a]) => ({ from: toMonth(XLSX, f.trim()), amt: toNum(a.trim()) })).filter(s => s.from && s.amt);
      const activeCell = col(r, "Đang áp dụng");
      recurring.push({ id: uid(), name, amt, kind, cat: toCat(col(r, "Danh mục"), kind, name), active: activeCell === "" || isMark(activeCell), since: toMonth(XLSX, col(r, "Từ tháng")) || null, until: toMonth(XLSX, col(r, "Đến tháng")) || null, ...(steps.length ? { steps } : {}) });
    }
    recFromSheet = recurring.length > 0;
  }
  const keyOf = t => t.kind + "|" + norm(t.desc.replace(/\s+T\d{1,2}$/i, ""));
  if (!recFromSheet) {
    const groups = new Map();
    for (const t of rows) { const k = keyOf(t) + "|" + t.cat; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
    for (const list of groups.values()) {
      const months = [...new Set(list.map(t => t.m))].sort();
      if (months.length < 3) continue;
      const ref = list.filter(t => t.m <= cur).sort((a, b) => b.m.localeCompare(a.m))[0] || list[0];
      recurring.push({ id: uid(), name: ref.desc.replace(/\s+T\d{1,2}$/i, "").trim(), amt: ref.amt, cat: ref.cat, kind: ref.kind, active: true, since: months[0] });
    }
  }
  recurring.sort((a, b) => (a.kind === b.kind ? b.amt - a.amt : a.kind === "in" ? -1 : 1));
  const ridOf = new Map(recurring.map(r => [r.kind + "|" + norm(r.name), r.id]));

  const keep = [], future = [];
  for (const t of rows) {
    if (t.m > cur) { future.push(t); continue; }
    const rid = (recFromSheet ? t.mark : true) ? ridOf.get(keyOf(t)) : null;
    const { mark, ...rest } = t;
    keep.push({ ...rest, id: uid(), at: Date.now() + keep.length, ...(rid ? { rid } : {}) });
  }

  // Thiết lập: tháng bắt đầu và số dư đầu
  let startMonth = null, openingBalance = 0;
  for (const r of sheetRows(XLSX, wb, SHEETS.setup) || []) {
    const k = norm(col(r, "Mục")), v = col(r, "Giá trị");
    if (k.startsWith("thang bat dau")) startMonth = toMonth(XLSX, v);
    if (k.startsWith("so du dau")) openingBalance = toNum(v) || 0;
  }
  const firstTx = keep.map(t => t.m).sort()[0] || cur;
  if (!startMonth || startMonth > firstTx) startMonth = firstTx;

  const budgets = {};
  for (const r of sheetRows(XLSX, wb, SHEETS.budget) || []) {
    const cat = toCat(col(r, "Danh mục"), "out", ""), amt = toNum(col(r, "Số tiền"));
    if (!norm(col(r, "Danh mục")) || cat === "Savings") continue;
    budgets[cat] = upsertStep(budgets[cat] || [], toMonth(XLSX, col(r, "Từ tháng")) || startMonth, { amt: amt && amt > 0 ? amt : 0 });
  }
  const closings = {};
  for (const r of sheetRows(XLSX, wb, SHEETS.close) || []) {
    const m = toMonth(XLSX, col(r, "Tháng"));
    if (m) closings[m] = { cash: toNum(col(r, "Tiền mặt")) || 0, bank: toNum(col(r, "Tài khoản")) || 0 };
  }

  const learned = {};
  for (const t of keep) { const n = norm(t.desc); if (n) learned[t.kind + ":" + n] = t.cat; }
  return { tx: keep, future, recurring, recFromSheet, startMonth, openingBalance, budgets, closings, learned };
}

async function handleFile(file) {
  if (!file) return;
  toast("Đang đọc file…");
  try {
    const [XLSX, buf] = await Promise.all([loadXLSX(), file.arrayBuffer()]);
    const res = parseWorkbook(XLSX, XLSX.read(buf, { type: "array" }));

    toast(e && e.message === "load" ? "Không tải được bộ đọc Excel. Kiểm tra mạng rồi thử lại." : (e && e.message) || "Không đọc được file này.");
  }
}

async function applyImport(res) {
  const keepGoal = S.goal;
  S = Object.assign(DEFAULTS(), { startMonth: res.startMonth, openingBalance: res.openingBalance, recurring: res.recurring, budgets: res.budgets, learned: res.learned, goal: keepGoal, importedAt: Date.now() });
  M = {};
  for (const t of res.tx) (M[t.m] = M[t.m] || []).push(t);
  // Chốt sổ theo thứ tự tháng để số dư theo sổ của mỗi tháng tính đúng
  for (const m of Object.keys(res.closings).sort()) {
    const c = res.closings[m];
    S.closings[m] = { ...c, book: (openingOf(m) ?? 0) + totals(m).net, at: Date.now() };
  }
  hasData = true;
  ui.tab = "home"; ui.viewMonth = curMonth(); ui.closeMonth = null; ui.qaMonth = curMonth();
  closeSheet(); render();
  await Store.replaceAll();
  toast(`Đã nhập ${res.tx.length} giao dịch và ${res.recurring.length} khoản cố định`);
}

/* ---------- Excel export và file mẫu ---------- */
async function saveWorkbook(XLSX, wb, filename) {
  const data = XLSX.write(wb, { type: "array", bookType: "xlsx" });
  let downloads = null;
  if (window.claude && window.claude.use) { try { downloads = await window.claude.use("downloads"); } catch (e) {} }
  if (downloads) {
    try { const r = await downloads.save({ filename, data }); if (r && r.status === "saved") toast("Đã lưu " + filename); }
    catch (e) { if (!(e && e.code === "cancelled")) toast("Chưa lưu được file. Thử lại sau."); }
    return;
  }
  const url = URL.createObjectURL(new Blob([data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, actLabel, fn) {
  const root = $("#toast-root");
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${actLabel ? `<button data-act="toast-act">${esc(actLabel)}</button>` : ""}</div>`;
  root.onclick = e => { if (e.target.closest("[data-act=toast-act]") && fn) { fn(); root.innerHTML = ""; } };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ""; }, actLabel ? 5000 : 3000);
}

/* ---------- Events ---------- */
function armDanger(el, label) {
  if (el.classList.contains("armed")) return true;
  el.classList.add("armed"); el.textContent = label;
  setTimeout(() => { if (el.isConnected) { el.classList.remove("armed"); el.textContent = el.dataset.orig || "Xóa"; } }, 3500);
  return false;
}
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  const st = sheet ? sheet.state : null;
  switch (act) {
    case "fab": openQuickAdd(); break;
    case "plan-seg": ui.tab = el.dataset.seg; render(); window.scrollTo(0, 0); break;
    case "ov-month": case "ledger-month": ui.tab = "month"; ui.viewMonth = el.dataset.m; render(); if (act === "ov-month") window.scrollTo(0, 0); break;
    case "qa-cat-set": { const { kind } = qaState(); ui.qaKind = kind; ui.qaCat = el.dataset.cat; renderQaPreview(); $("#qa-input").focus(); break; }
    case "qa-detail": {
      const { p, kind, cat } = qaState();
      openTxSheet(null, ui.qaDate.slice(0, 7), { kind, unit: p.unit, qty: p.qty, desc: p.desc, cat, m: ui.qaDate.slice(0, 7), d: ui.qaDate, n: 1 });
      break;
    }
    case "tab":
      if (el.dataset.tab === "close") ui.closeBack = ui.tab;
      ui.tab = el.dataset.tab === "plan" ? (ui.planSeg || "fixed") : el.dataset.tab;
      if (el.dataset.m) ui.viewMonth = el.dataset.m;
      if (ui.tab === "close") ui.closeMonth = null;
      if (ui.tab === "home") ui.qaMonth = curMonth();
      render(); window.scrollTo(0, 0); break;
    case "settings": if (Store.mode !== "loading") openSettings(); break;
    case "pick-file": $("#file-xlsx").click(); break;
    case "start-fresh": openSetup(); break;
    case "su-flag": st[el.dataset.k] = el.dataset.v === "1"; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); break;
    case "setup-save": saveSetup(st); break;
    case "confirm-all": {
      const m = el.dataset.m, made = pendingRec(m).map(r => confirmRec(r, m));
      render(); toast(`Đã ghi ${made.length} khoản cố định`, "Hoàn tác", () => { made.forEach(t => deleteTx(t.id)); render(); }); break;
    }
    case "lg-kind": ui.lgKind = el.dataset.kind; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); renderLedgerList(); break;
    case "hide-checklist": S.hideChecklist = true; Store.touch("settings"); render(); break;
    case "edit-start": openStartSheet(false); break;
    case "start-save": {
      const m = $("#start-month").value || curMonth(), bal = parseMoney($("#start-bal").value) || 0;
      if (st.fresh) { S = Object.assign(DEFAULTS(), { startMonth: m, openingBalance: bal }); M = {}; hasData = true; }
      else { S.startMonth = m; S.openingBalance = bal; }
      Store.touch("settings"); closeSheet(); render();
      toast(st.fresh ? "Đã tạo sổ. Thêm khoản cố định ở tab Cố định." : "Đã lưu điểm bắt đầu"); break;
    }
    case "go-close": ui.closeBack = ui.tab; ui.tab = "close"; ui.closeMonth = el.dataset.m; render(); window.scrollTo(0, 0); break;
    case "confirm-rec": {
      const r = S.recurring.find(x => x.id === el.dataset.id); if (!r) break;

    case "skip-rec": {

      toast(`Bỏ qua ${r.name} ${mShort(el.dataset.m)}`, "Hoàn tác", () => { S.skips[el.dataset.m] = (S.skips[el.dataset.m] || []).filter(id => id !== r.id); Store.touch("settings"); render(); }); break;

    case "tx-save": {
      const unit = parseMoney($("#tx-unit").value);
      if (!unit || unit <= 0) { toast("Nhập số tiền, ví dụ 45k"); $("#tx-unit").focus(); break; }
      const qty = Math.max(1, Math.round(Number($("#tx-qty").value) || 1));
      const data = { kind: st.kind, unit, qty, amt: unit * qty, desc: $("#tx-desc").value.trim() || catOf(st.kind, st.cat).label, cat: st.cat, d: $("#tx-date").value || today(), m: ($("#tx-date").value || today()).slice(0, 7), n: st.kind === "in" ? 1 : Number($("#tx-n").value) || 1 };
      if (st.id) updateTx(st.id, data); else addTx(data);
      closeSheet(); render(); toast(st.id ? "Đã lưu" : `Đã thêm ${money(data.amt)}`); break;
    }
    case "tx-delete": {
      el.dataset.orig = "Xóa";
      if (!armDanger(el, "Bấm lần nữa để xóa")) break;
      const t = deleteTx(st.id); closeSheet(); render();
      if (t) toast("Đã xóa " + (t.desc || ""), "Hoàn tác", () => { addTx(t); render(); }); break;
    }
    case "rec-save": {
      const amt = parseMoney($("#rec-amt").value), name = $("#rec-name").value.trim();
      if (!name || !amt || amt <= 0) { toast("Cần tên và số tiền mỗi tháng"); break; }
      const since = $("#rec-since").value || curMonth(), until = $("#rec-until").value || null;
      if (until && until < since) { toast("Tháng kết thúc phải sau tháng bắt đầu"); break; }
      const data = { name, kind: st.kind, cat: st.cat, active: $("#rec-active").checked, since, until };
      if (st.id) {
        const r = S.recurring.find(x => x.id === st.id), from = $("#rec-from").value || curMonth();
        if (amt !== recAmt(r, from)) {
          // Giữ số cũ cho các tháng trước, số mới từ tháng đã chọn
          r.steps = upsertStep(r.steps && r.steps.length ? r.steps : [{ from: r.since || S.startMonth, amt: r.amt }], from, { amt });
        }
        Object.assign(r, data);
        r.amt = recAmt(r, curMonth());
      } else S.recurring.push({ id: uid(), amt, ...data });
      Store.touch("settings"); closeSheet(); render(); toast("Đã lưu khoản cố định"); break;
    }
    case "rec-delete": {
      el.dataset.orig = "Xóa";
      if (!armDanger(el, "Bấm lần nữa để xóa")) break;
      S.recurring = S.recurring.filter(r => r.id !== st.id); Store.touch("settings"); closeSheet(); render(); toast("Đã xóa khoản cố định. Giao dịch cũ vẫn giữ."); break;
    }
    case "close-month": ui.closeMonth = el.dataset.m; ui.tab = "close"; render(); break;
    case "close-adjust": {
      const d = Number(el.dataset.d), m = ui.closeMonth;
      const keep = [$("#close-cash").value, $("#close-bank").value];
      addTx({ m, d: m + "-" + pad(daysIn(m)), kind: d < 0 ? "out" : "in", amt: Math.abs(d), unit: Math.abs(d), qty: 1, desc: d < 0 ? "Chi chưa rõ (chốt sổ)" : "Thu chưa rõ (chốt sổ)", cat: "Other", n: 1 });
      render(); $("#close-cash").value = keep[0]; $("#close-bank").value = keep[1]; updateCloseDiff();
      toast("Đã ghi khoản chênh lệch"); break;
    }
    case "do-close": {
      const cash = parseMoney($("#close-cash").value), bank = parseMoney($("#close-bank").value);
      if (cash == null && bank == null) { toast("Nhập tiền mặt hoặc số dư tài khoản trước"); $("#close-cash").focus(); break; }
      const m = el.dataset.m;
      S.closings[m] = { cash: cash || 0, bank: bank || 0, book: (openingOf(m) ?? 0) + totals(m).net, at: Date.now() };
      Store.touch("settings"); render(); toast(`Đã chốt ${mLabel(m).toLowerCase()}`); break;
    }
    case "reopen": delete S.closings[el.dataset.m]; Store.touch("settings"); render(); break;
    case "qa-kind-set": ui.qaKind = el.dataset.kind; ui.qaCat = null; renderQaPreview(); $("#qa-input").focus(); break;
    case "qa-date": ui.qaDate = el.dataset.d; renderQaPreview(); break;
    case "qa-recent": {
      const t = allTx().find(x => x.id === el.dataset.id); if (!t) break;
      $("#qa-input").value = `${t.desc} ${nf.format(t.amt)}`;
      ui.qaKind = t.kind; ui.qaCat = t.cat; renderQaPreview(); $("#qa-input").focus(); break;
    }
    case "export": exportExcel(); break;
    case "wipe": {
      el.dataset.orig = "Xóa toàn bộ dữ liệu";
      if (!armDanger(el, "Bấm lần nữa: xóa vĩnh viễn")) break;
      closeSheet(); await Store.wipe(); S = DEFAULTS(); M = {}; hasData = false; ui.tab = "home"; render(); toast("Đã xóa sổ"); break;
    }
    case "template": downloadTemplate(); break;
    case "goal-edit": openGoalSheet(); break;
    case "term": openTermSheet(Number(el.dataset.i)); break;
    case "term-save": case "term-clear": {
      const ovs = S.goal.overrides = S.goal.overrides || {};
      if (act === "term-clear") delete ovs[st.m];
      else {
        const extra = parseMoney($("#term-extra").value), actual = parseMoney($("#term-actual").value);
        const rate = parsePct($("#term-rate").value), loanExtra = $("#term-loan") ? parseMoney($("#term-loan").value) : null;
        const o = {};
        if (rate != null) o.rate = rate;
        if (extra) o.extra = extra;
        if (loanExtra && loanExtra > 0) o.loanExtra = loanExtra;
        if (actual != null) o.actual = actual;
        if (Object.keys(o).length) ovs[st.m] = o; else delete ovs[st.m];
      }
      Store.touch("settings"); closeSheet(); render(); toast("Đã cập nhật kỳ " + mShort(st.m)); break;
    }
    case "g-add-m": { const d = readGoalForm(st.draft); const lastM = d.monthly[d.monthly.length - 1]; d.monthly.push({ from: lastM ? addM(lastM.from, 6) : d.start, amt: lastM ? lastM.amt : 5e6 }); openGoalSheet(d); break; }
    case "g-del-m": { const d = readGoalForm(st.draft); d.monthly.splice(Number(el.dataset.i), 1); openGoalSheet(d); break; }
    case "g-add-y": { const d = readGoalForm(st.draft); d.yearly.push({ moy: 1, amt: 5e7 }); openGoalSheet(d); break; }
    case "g-del-y": { const d = readGoalForm(st.draft); d.yearly.splice(Number(el.dataset.i), 1); openGoalSheet(d); break; }
    case "rate-update": openRateSheet(); break;
    case "rate-save": {
      const g = S.goal;
      const sav = parsePct($("#rs-sav").value);
      let n = 0;
      if (sav != null) { g.rates = upsertStep(g.rates, $("#rs-from").value, { rate: sav }); n++; }
      g.loans.forEach((L, j) => {
        const r = parsePct($(`#rs-lr-${j}`).value), f = $(`#rs-lf-${j}`).value;
        if (r != null && f) { L.rates = upsertStep(L.rates, f, { rate: r }); n++; }
      });
      if (!n) { toast("Nhập ít nhất một mức lãi mới"); break; }
      Store.touch("settings"); closeSheet(); render(); toast("Đã cập nhật lãi suất"); break;
    }
    case "g-add-r": { const d = readGoalForm(st.draft); const lr = d.rates[d.rates.length - 1]; d.rates.push({ from: lr ? addM(lr.from, d.termMonths || 6) : d.start, rate: lr ? lr.rate : 5 }); openGoalSheet(d); break; }
    case "g-del-r": { const d = readGoalForm(st.draft); if (d.rates.length > 1) d.rates.splice(Number(el.dataset.i), 1); else toast("Cần giữ ít nhất một mốc lãi"); openGoalSheet(d); break; }
    case "g-add-loan": { const d = readGoalForm(st.draft); d.loans.push(newLoan(d)); openGoalSheet(d); break; }
    case "g-del-loan": { const d = readGoalForm(st.draft); d.loans.splice(Number(el.dataset.j), 1); openGoalSheet(d); break; }
    case "g-add-lr": { const d = readGoalForm(st.draft); const L = d.loans[Number(el.dataset.j)]; const lr = L.rates[L.rates.length - 1]; L.rates.push({ from: lr ? addM(lr.from, 12) : L.borrowAt, rate: lr ? lr.rate : 0 }); openGoalSheet(d); break; }
    case "g-del-lr": { const d = readGoalForm(st.draft); const L = d.loans[Number(el.dataset.j)]; if (L.rates.length > 1) L.rates.splice(Number(el.dataset.i), 1); else toast("Cần giữ ít nhất một mốc lãi"); openGoalSheet(d); break; }
    case "g-save": {
      const d = readGoalForm(st.draft);
      d.monthly = d.monthly.filter(s => s.from).sort((a, b) => a.from.localeCompare(b.from));
      d.rates = d.rates.filter(s => s.from).sort((a, b) => a.from.localeCompare(b.from));
      d.loans.forEach(L => { L.rates = L.rates.filter(s => s.from).sort((a, b) => a.from.localeCompare(b.from)); });
      d.yearly = d.yearly.filter(y => y.amt);
      const bad = d.loans.find(L => !L.total || !L.perTerm);
      if (bad) { toast(`Khoản vay “${bad.name}” cần tổng vay và số trả mỗi kỳ`); break; }
      S.goal = d; Store.touch("settings"); closeSheet(); ui.tab = "goal"; render(); toast("Đã lưu kế hoạch"); break;
    }
    case "g-remove": {
      el.dataset.orig = "Xóa kế hoạch";
      if (!armDanger(el, "Bấm lần nữa để xóa")) break;
      S.goal = null; Store.touch("settings"); closeSheet(); render(); toast("Đã xóa kế hoạch"); break;
    }
    case "import-go": { const btn = el; btn.disabled = true; btn.textContent = "Đang nhập…"; await applyImport(st.res); break; }
    case "sheet-close": closeSheet(); break;
    case "sheet-bg": if (e.target === el) closeSheet(); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "qa-input") { if (!e.target.value) { ui.qaCat = null; ui.qaKind = null; } renderQaPreview(); }
  if (e.target.id === "close-cash" || e.target.id === "close-bank") updateCloseDiff();
  if (["tx-unit", "tx-qty"].includes(e.target.id)) updateTxTotal();
  if (e.target.id === "lg-search") { ui.lgQuery = e.target.value; renderLedgerList(); }
  if (e.target.matches && e.target.matches("input[data-money]")) moneyHint(e.target);
});
document.addEventListener("change", e => {
  if (e.target.id === "tx-n") updateTxTotal();
  if (e.target.id === "qa-date-pick" && e.target.value) { ui.qaDate = e.target.value > today() ? today() : e.target.value; renderQaPreview(); }
  if (/^g-l\d+-mode$/.test(e.target.id) && sheet && sheet.state.goalForm) openGoalSheet(readGoalForm(sheet.state.draft));
  if (e.target.id === "file-xlsx") { const f = e.target.files[0]; e.target.value = ""; closeSheet(); handleFile(f); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheet) { closeSheet(); return; }
  // Trên máy tính: phím N mở ô ghi nhanh
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if (!sheet && !typing && hasData && !e.metaKey && !e.ctrlKey && !e.altKey && (e.key === "n" || e.key === "N")) { e.preventDefault(); openQuickAdd(); }
});
// Hiện số tiền đầy đủ ngay dưới ô nhập, để "1tr5" hay "55k" không bị hiểu nhầm
function moneyHint(input) {
  let hint = input.nextElementSibling;
  if (!hint || !hint.classList.contains("money-hint")) { hint = document.createElement("span"); hint.className = "money-hint"; input.insertAdjacentElement("afterend", hint); }
  const v = input.value.trim() ? parseMoney(input.value) : null;
  hint.textContent = v == null ? (input.value.trim() ? "Chưa hiểu số tiền này" : "") : `= ${money(v)}`;
  hint.classList.toggle("bad", v == null && !!input.value.trim());
}
document.addEventListener("submit", e => { if (e.target.id === "qa-form") submitQuick(e); });

Store.init().then(render, () => { Store.mode = "local"; render(); });
</script>
</body></html>
