      if (act === "term-clear") delete ovs[st.m];
      else {
        const extra = parseMoney($("#term-extra").value), actual = parseMoney($("#term-actual").value);
        const rate = parsePct($("#term-rate").value), loanExtra = $("#term-loan") ? parseMoney($("#term-loan").value) : null;
        const o = {};
        if (rate != null) o.rate = rate;
        if (extra) o.extra = extra;
        if (loanExtra && loanExtra > 0) o.loanExtra = loanExtra;
        if (actual != null) o.actual = actual;
        if (Object.keys(o).length) ovs[st.m] = o; else delete ovs[st.m];
      }
      Store.touch("settings"); closeSheet(); render(); toast("Đã cập nhật kỳ " + mShort(st.m)); break;
    }
    case "g-add-m": { const d = readGoalForm(st.draft); const lastM = d.monthly[d.monthly.length - 1]; d.monthly.push({ from: lastM ? addM(lastM.from, 6) : d.start, amt: lastM ? lastM.amt : 5e6 }); openGoalSheet(d); break; }
    case "g-del-m": { const d = readGoalForm(st.draft); d.monthly.splice(Number(el.dataset.i), 1); openGoalSheet(d); break; }
    case "g-add-y": { const d = readGoalForm(st.draft); d.yearly.push({ moy: 1, amt: 5e7 }); openGoalSheet(d); break; }
    case "g-del-y": { const d = readGoalForm(st.draft); d.yearly.splice(Number(el.dataset.i), 1); openGoalSheet(d); break; }
    case "rate-update": openRateSheet(); break;
    case "rate-save": {
      const g = S.goal;
      const sav = parsePct($("#rs-sav").value);
      let n = 0;
      if (sav != null) { g.rates = upsertStep(g.rates, $("#rs-from").value, { rate: sav }); n++; }
      g.loans.forEach((L, j) => {
        const r = parsePct($(`#rs-lr-${j}`).value), f = $(`#rs-lf-${j}`).value;
        if (r != null && f) { L.rates = upsertStep(L.rates, f, { rate: r }); n++; }
      });
      if (!n) { toast("Nhập ít nhất một mức lãi mới"); break; }
      Store.touch("settings"); closeSheet(); render(); toast("Đã cập nhật lãi suất"); break;
    }
    case "g-add-r": { const d = readGoalForm(st.draft); const lr = d.rates[d.rates.length - 1]; d.rates.push({ from: lr ? addM(lr.from, d.termMonths || 6) : d.start, rate: lr ? lr.rate : 5 }); openGoalSheet(d); break; }
    case "g-del-r": { const d = readGoalForm(st.draft); if (d.rates.length > 1) d.rates.splice(Number(el.dataset.i), 1); else toast("Cần giữ ít nhất một mốc lãi"); openGoalSheet(d); break; }
    case "g-add-loan": { const d = readGoalForm(st.draft); d.loans.push(newLoan(d)); openGoalSheet(d); break; }
    case "g-del-loan": { const d = readGoalForm(st.draft); d.loans.splice(Number(el.dataset.j), 1); openGoalSheet(d); break; }
    case "g-add-lr": { const d = readGoalForm(st.draft); const L = d.loans[Number(el.dataset.j)]; const lr = L.rates[L.rates.length - 1]; L.rates.push({ from: lr ? addM(lr.from, 12) : L.borrowAt, rate: lr ? lr.rate : 0 }); openGoalSheet(d); break; }
    case "g-del-lr": { const d = readGoalForm(st.draft); const L = d.loans[Number(el.dataset.j)]; if (L.rates.length > 1) L.rates.splice(Number(el.dataset.i), 1); else toast("Cần giữ ít nhất một mốc lãi"); openGoalSheet(d); break; }
    case "g-save": {
      const d = readGoalForm(st.draft);
      d.monthly = d.monthly.filter(s => s.from).sort((a, b) => a.from.localeCompare(b.from));
      d.rates = d.rates.filter(s => s.from).sort((a, b) => a.from.localeCompare(b.from));
      d.loans.forEach(L => { L.rates = L.rates.filter(s => s.from).sort((a, b) => a.from.localeCompare(b.from)); });
      d.yearly = d.yearly.filter(y => y.amt);
      const bad = d.loans.find(L => !L.total || !L.perTerm);
      if (bad) { toast(`Khoản vay “${bad.name}” cần tổng vay và số trả mỗi kỳ`); break; }
      S.goal = d; Store.touch("settings"); closeSheet(); ui.tab = "goal"; render(); toast("Đã lưu kế hoạch"); break;
    }
    case "g-remove": {
      el.dataset.orig = "Xóa kế hoạch";
      if (!armDanger(el, "Bấm lần nữa để xóa")) break;
      S.goal = null; Store.touch("settings"); closeSheet(); render(); toast("Đã xóa kế hoạch"); break;
    }
    case "import-go": { const btn = el; btn.disabled = true; btn.textContent = "Đang nhập…"; await applyImport(st.res); break; }
    case "qa-wallet": ui.qaWallet = el.dataset.w; renderQaPreview(); break;
    case "tx-wallet": st.w = el.dataset.w; el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === el)); break;
    case "wallet-new": openWalletSheet(null); break;
    case "wallet-edit": openWalletSheet(el.dataset.w); break;
    case "w-icon": st.icon = el.dataset.icon; el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === el)); break;
    case "w-src": {
      st.src = el.dataset.v; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el));
      $("#w-src-note").textContent = st.src === "new" ? "Cộng thêm vào tổng tiền đang có. Không tính là khoản thu." : `Tách ra từ ${S.mainWallet || "Ví chính"} (đang có ${money(walletsNow().list[0].bal)}).`;
      break;
    }
    case "wallet-save": {
      const name = $("#w-name").value.trim();
      if (!name) { toast("Đặt tên cho ví"); $("#w-name").focus(); break; }
      if (st.wid === MAIN) { S.mainWallet = name; Store.touch("settings"); closeSheet(); render(); toast("Đã lưu"); break; }
      const bal = $("#w-bal").value.trim() ? parseMoney($("#w-bal").value) : 0;
      if (bal == null) { toast("Chưa hiểu số dư, ví dụ 2tr"); break; }
      const now = Date.now();
      if (!st.wid) {
        const w = { id: "w_" + uid(), name, icon: st.icon || "wallet", start: st.src === "new" ? 0 : bal, at: now };
        S.wallets.push(w);
        if (st.src === "new" && bal) addTx({ m: curMonth(), d: today(), kind: bal > 0 ? "in" : "out", amt: Math.abs(bal), unit: Math.abs(bal), qty: 1, desc: "Số dư ban đầu " + name, cat: "Other", n: 1, adj: true, w: w.id, at: now });
        toast(`Đã thêm ví ${name}`);
      } else {
        const w = walletOf(st.wid); if (!w) break;
        w.name = name; w.icon = st.icon || w.icon;
        if (Math.round(bal) !== Math.round(st.cur)) { w.start = bal; w.at = now; }
        toast("Đã lưu ví");
      }
      Store.touch("settings"); closeSheet(); render(); break;
    }
    case "wallet-del": {
      el.dataset.orig = "Xóa ví";
      if (!armDanger(el, "Bấm lần nữa để xóa")) break;
      const w = walletOf(st.wid); if (!w) break;
      S.wallets = S.wallets.filter(x => x.id !== w.id);
      if (S.lastWallet === w.id) S.lastWallet = MAIN;
      Store.touch("settings"); closeSheet(); render(); toast(`Đã xóa ví ${w.name}. Số dư gộp về ${S.mainWallet || "Ví chính"}.`); break;
    }
    case "open-cats": openCatSheet("out"); break;
    case "open-wallets": closeSheet(); ui.tab = "wallets"; render(); window.scrollTo(0, 0); break;
    case "cat-kind": openCatSheet(el.dataset.kind); break;
    case "cat-new": openCatEdit(el.dataset.kind, null, el.dataset.back || "cats"); break;
    case "cat-edit": openCatEdit(el.dataset.kind, el.dataset.id, "cats"); break;
    case "cat-toggle": {
      const k = el.dataset.kind, id = el.dataset.id;
      S.hiddenCats = S.hiddenCats || { out: [], in: [] };
      const h = S.hiddenCats[k] = S.hiddenCats[k] || [];
      if (h.includes(id)) S.hiddenCats[k] = h.filter(x => x !== id); else h.push(id);
      Store.touch("settings"); openCatSheet(k); render(); break;
    }
    case "ce-icon": st.icon = el.dataset.icon; el.parentElement.querySelectorAll(".icon-pick").forEach(b => b.classList.toggle("on", b === el)); catPreview(); break;
    case "ce-tint": st.tint = el.dataset.tint; el.parentElement.querySelectorAll(".tint-pick").forEach(b => b.classList.toggle("on", b === el)); catPreview(); break;
    case "cat-save": {
      const label = $("#ce-name").value.trim();
      if (!label) { toast("Đặt tên cho danh mục"); $("#ce-name").focus(); break; }
      const dup = allCats(st.kind).find(c => norm(c.label) === norm(label) && c.id !== st.id);
      if (dup) { toast(`Đã có danh mục “${dup.label}”`); break; }
      S.cats = S.cats || { out: [], in: [] };
      const list = S.cats[st.kind] = S.cats[st.kind] || [];
      let id = st.id;
      if (id) Object.assign(list.find(c => c.id === id), { label, icon: st.icon, tint: st.tint });
      else { id = "c_" + uid(); list.push({ id, label, icon: st.icon, tint: st.tint }); }
      Store.touch("settings"); render(); toast(st.id ? "Đã lưu danh mục" : `Đã tạo danh mục ${label}`);
      catBack(st, st.id ? null : id); break;
    }
    case "cat-del": {
      el.dataset.orig = "Xóa";
      if (!armDanger(el, "Bấm lần nữa để xóa")) break;
      const k = st.kind, id = st.id;
      S.cats[k] = (S.cats[k] || []).filter(c => c.id !== id);
      // Giao dịch, khoản cố định thuộc danh mục này chuyển về "Khác"
      for (const [m, l] of Object.entries(M)) if (l.some(t => t.kind === k && t.cat === id)) { l.forEach(t => { if (t.kind === k && t.cat === id) t.cat = "Other"; }); Store.touchMonth(m); }
      S.recurring.forEach(r => { if ((r.kind === "in" ? "in" : "out") === k && r.cat === id) r.cat = "Other"; });
      if (k === "out") delete S.budgets[id];
      for (const key of Object.keys(S.learned)) if (S.learned[key] === id) delete S.learned[key];
      Store.touch("settings"); render(); toast("Đã xóa. Các khoản cũ chuyển về Khác.");
      openCatSheet(k); break;
    }
    case "install": openInstall(); break;
    case "reminder": openReminder(); break;
    case "rm-ics": downloadIcs(); toast("Đã tải file lịch"); break;
    case "backup": makeBackup(); break;
    case "pick-json": $("#file-json").click(); break;
    case "restore-go": { el.disabled = true; el.textContent = "Đang khôi phục…"; await applyBackup(st.backup); break; }
    case "move-new": openMoveSheet(); break;
    case "move-save": {
      const from = $("#mv-from").value, to = $("#mv-to").value, amt = parseMoney($("#mv-amt").value);
      if (from === to) { toast("Chọn hai ví khác nhau"); break; }
      if (!amt || amt <= 0) { toast("Nhập số tiền, ví dụ 500k"); $("#mv-amt").focus(); break; }
      S.moves = S.moves || [];
      S.moves.push({ id: uid(), at: Date.now(), d: today(), from, to, amt });
      Store.touch("settings"); closeSheet(); render(); toast(`Đã chuyển ${short(amt)} sang ${walletName(to === MAIN ? null : to)}`); break;
    }
    case "move-del": S.moves = (S.moves || []).filter(x => x.id !== el.dataset.id); Store.touch("settings"); render(); toast("Đã xóa lần chuyển tiền"); break;
    case "sheet-close": closeSheet(); break;
    case "sheet-bg": if (e.target === el) closeSheet(); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "qa-input") { if (!e.target.value) { ui.qaCat = null; ui.qaKind = null; } renderQaPreview(); }
  if (e.target.classList && e.target.classList.contains("close-in")) updateCloseDiff();
  if (["tx-unit", "tx-qty"].includes(e.target.id)) updateTxTotal();
  if (e.target.id === "lg-search") { ui.lgQuery = e.target.value; renderLedgerList(); }
  if (e.target.id === "ce-name") catPreview();
  if (e.target.id === "rm-time") updateReminderLink();
  if (e.target.matches && e.target.matches("input[data-money]")) moneyHint(e.target);
});
document.addEventListener("change", e => {
  if (e.target.id === "tx-n") updateTxTotal();
  if (e.target.id === "qa-date-pick" && e.target.value) { ui.qaDate = e.target.value > today() ? today() : e.target.value; renderQaPreview(); }
  if (/^g-l\d+-mode$/.test(e.target.id) && sheet && sheet.state.goalForm) openGoalSheet(readGoalForm(sheet.state.draft));
  if (e.target.id === "file-xlsx") { const f = e.target.files[0]; e.target.value = ""; closeSheet(); handleFile(f); }
  if (e.target.id === "file-json") { const f = e.target.files[0]; e.target.value = ""; closeSheet(); readBackup(f); }
  if (e.target.id === "rm-time") { S.remindAt = e.target.value; Store.touch("settings"); updateReminderLink(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheet) { closeSheet(); return; }
  // Trên máy tính: phím N mở ô ghi nhanh
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
  if (!sheet && !typing && hasData && !e.metaKey && !e.ctrlKey && !e.altKey && (e.key === "n" || e.key === "N")) { e.preventDefault(); openQuickAdd(); }
});
// Hiện số tiền đầy đủ ngay dưới ô nhập, để "1tr5" hay "55k" không bị hiểu nhầm
function moneyHint(input) {
  let hint = input.nextElementSibling;
  if (!hint || !hint.classList.contains("money-hint")) { hint = document.createElement("span"); hint.className = "money-hint"; input.insertAdjacentElement("afterend", hint); }
  const v = input.value.trim() ? parseMoney(input.value) : null;
  hint.textContent = v == null ? (input.value.trim() ? "Chưa hiểu số tiền này" : "") : `= ${money(v)}`;
  hint.classList.toggle("bad", v == null && !!input.value.trim());
}
document.addEventListener("submit", e => { if (e.target.id === "qa-form") submitQuick(e); });

Store.init().then(render, () => { Store.mode = "local"; render(); }).then(() => {
  // Lối tắt "Ghi giao dịch" từ biểu tượng app: mở ngay ô ghi nhanh
  if (new URLSearchParams(location.search).has("ghi") && hasData) { history.replaceState(null, "", location.pathname); openQuickAdd(); }
});
// Cài như app: chỉ khi chạy trên web thật (không phải bản xem trước trong claude.ai)
if ("serviceWorker" in navigator && !window.claude && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body></html>
